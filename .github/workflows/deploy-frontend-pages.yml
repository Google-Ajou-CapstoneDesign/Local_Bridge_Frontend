name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend-pages.yml"
  workflow_dispatch: {} # Actions 탭에서 수동 실행 가능

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.9"
          channel: stable

      - run: flutter pub get

      # 저장소가 조직 프로젝트 페이지(<org>.github.io/<repo>/)로 서빙되므로
      # base-href를 repo 이름과 맞춰야 정적 리소스 경로가 깨지지 않는다.
      # API 주소는 기존 dart-define 파일(env/prod.json)을 그대로 재사용한다 — 하드코딩 없음.
      - run: |
          flutter build web --release \
            --base-href=/Suwon_multiculturalism_v2/ \
            --dart-define-from-file=env/prod.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
